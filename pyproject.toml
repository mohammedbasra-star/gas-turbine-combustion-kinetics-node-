[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gas-turbine-combustion-kinetics-node"
version = "1.0.0"
authors = [
  { name="Mohammed Basra", email="mohammedbasra.star@gmail.com" },
]
description = "Stiff Neural Ordinary Differential Equations (Neural ODEs) for Gas Turbine Combustion Kinetics, Autoignition, and Thermal NOx Emissions"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
]
